name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code and Codex CLIs
        run: npm install -g @anthropic-ai/claude-code@2.1.304 @openai/codex@0.163.0
      - name: Validate and install into throwaway homes
        run: scripts/validate.sh --smoke
